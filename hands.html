<script>

  const balls = JOINTS.map(function (n) { const m = new THREE.Mesh(new THREE.SphereGeometry(n.indexOf('tip') > 0 ? 0.011 : 0.008, 8, 6), mat); m.visible = false; scene.add(m); return m; });
  const glow = halo(i === 0 ? GLOW.saffron : GLOW.blue, 0.16, 0.9); glow.visible = false; scene.add(glow);
  return { side: i, seen: false, pts: [], palm: new THREE.Vector3(), tip: new THREE.Vector3(), balls: balls, glow: glow };
});
const tmpV = new THREE.Vector3(), head = new THREE.Vector3(0, 1.6, 0);
let headBase = 1.6, sim = false;

function readHands(frame) {
  HAND.forEach(function (h) { h.seen = false; h.pts.length = 0; h.balls.forEach(function (b) { b.visible = false; }); h.glow.visible = false; });
  if (sim) { simHands(); return; }
  if (!frame) return;
  const ref = renderer.xr.getReferenceSpace(), vp = frame.getViewerPose(ref);
  if (vp) head.set(vp.transform.position.x, vp.transform.position.y, vp.transform.position.z);
  for (const src of frame.session.inputSources) {
    const h = HAND[src.handedness === 'left' ? 0 : src.handedness === 'right' ? 1 : -1]; if (!h) continue;
    if (src.hand) {
      let k = 0;
      for (let j = 0; j < JOINTS.length; j++) {
        const sp = src.hand.get(JOINTS[j]); const p = sp && frame.getJointPose(sp, ref); if (!p) continue;
        const v = p.transform.position, ball = h.balls[j]; ball.position.set(v.x, v.y, v.z); ball.visible = true; k++;
        if (TOUCH_J[JOINTS[j]]) h.pts.push(ball.position);
        if (JOINTS[j] === 'middle-finger-metacarpal') h.palm.copy(ball.position);
        if (JOINTS[j] === 'index-finger-tip') h.tip.copy(ball.position);
      }
      h.seen = k > 5;
    } else if (src.gripSpace) {                               /* controller: its tip is the fingertip, its body the palm */
      const p = frame.getPose(src.gripSpace, ref); if (!p) continue;
      const m = new THREE.Matrix4().fromArray(p.transform.matrix);
      h.palm.setFromMatrixPosition(m); h.tip.set(0, -0.02, -0.07).applyMatrix4(m);
      h.balls[9].position.copy(h.tip); h.balls[9].visible = true; h.balls[0].position.copy(h.palm); h.balls[0].visible = true;
      h.pts.push(h.tip, h.palm); h.seen = true;
    }
    if (h.seen) { h.glow.position.copy(h.tip); h.glow.visible = true; }
  }
}

/* ---------- audio: the song without drums; every good touch plays the drum stem's own slice for that hit ---------- */
const A = D.audio; let ac = null, master = null, buf = {}, songStart = null, music = null, audioReady = null;
const PRE = { music: fetch(A.music).then(function (r) { return r.arrayBuffer(); }), drums: fetch(A.drums).then(function (r) { return r.arrayBuffer(); }) };
function audioInit() {                                         /* called from a tap: the context may only start on a gesture */
  if (audioReady) { if (ac.state !== 'running') ac.resume(); return audioReady; }
  ac = new (window.AudioContext || window.webkitAudioContext)(); master = ac.createGain(); master.connect(ac.destination);
  const dec = function (k) { return PRE[k].then(function (b) { return new Promise(function (ok, no) { ac.decodeAudioData(b.slice(0), ok, no); }); }).then(function (x) { buf[k] = x; }); };
  audioReady = Promise.all([dec('drums'), dec('music')]);
  return audioReady;
}
function songNow() { return ac && songStart !== null ? ac.currentTime - songStart : -99; }
function drumHit(hitT) {
  if (!buf.drums || songStart === null) return;
  const now = ac.currentTime, at = Math.max(now, songStart + hitT - A.hitLead), off = Math.max(0, hitT - A.hitLead + (at - (songStart + hitT - A.hitLead)));
  const s = ac.createBufferSource(), g = ac.createGain(); s.buffer = buf.drums; s.connect(g); g.connect(master);
  const L = A.hitLength; g.gain.setValueAtTime(A.hitVolume, at); g.gain.setValueAtTime(A.hitVolume, at + L - A.hitFade); g.gain.linearRampToValueAtTime(0, at + L);
  s.start(at, off, L);
}
function chime(freq, vol) { if (!ac) return; const o = ac.createOscillator(), g = ac.createGain(); o.type = 'sine'; o.frequency.value = freq; o.connect(g); g.connect(master); const t = ac.currentTime; g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + 1.2); o.start(t); o.stop(t + 1.3); }
function thud() { if (!ac) return; const o = ac.createOscillator(), g = ac.createGain(); o.type = 'square'; o.frequency.value = 120; o.connect(g); g.connect(master); const t = ac.currentTime; g.gain.setValueAtTime(0.08, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.18); o.start(t); o.stop(t + 0.2); }

/* ---------- game ---------- */
const G = { state: 'menu', mode: '', items: [], next: 0, score: 0, combo: 0, best: 0, perfect: 0, good: 0, wrong: 0, miss: 0, syms: 0, symsTotal: 0, total: 0, endAt: 0, lastScene: '' };
const fx = [];
function placeAhead(o, z) { o.position.set(o.userData.x, headBase + o.userData.y, z); }

function begin(mode) {
  audioInit().then(function () {
    clearItems(); G.mode = mode; G.state = 'run'; G.score = G.combo = G.best = G.perfect = G.good = G.wrong = G.miss = G.syms = 0; G.next = 0;
    headBase = head.y > 0.8 ? head.y : 1.6;
    const P = D.practice, list = [];
    if (mode === 'practice') {
      D.easy.forEach(function (e) { if (e[0] >= P.from && e[0] < P.from + P.len) list.push({ t: e[0], kind: e[1], h: e[2] }); });
      D.verses.slice(0, 2).forEach(function (v) { if (v.t >= P.from && v.t < P.from + P.len) list.push({ t: v.t, kind: 2, v: v }); });   /* practice: two pranams only */
      songStart = ac.currentTime + P.lead - P.from; G.endAt = P.from + P.len + 1.5;
    } else {
      D.easy.forEach(function (e) { list.push({ t: e[0], kind: e[1], h: e[2] }); });
      D.verses.forEach(function (v) { list.push({ t: v.t, kind: 2, v: v }); });
      songStart = ac.currentTime + 1.2; G.endAt = D.finishAt;
      music = ac.createBufferSource(); music.buffer = buf.music; music.connect(master); music.start(songStart);
    }
    list.sort(function (a, b) { return a.t - b.t; });
    G.queue = list; G.symsTotal = list.filter(function (x) { return x.kind === 2; }).length; G.total = list.length;
    showMenu(false); if (darshan) darshan.visible = false;
  });
}
function clearItems() { G.items.forEach(function (it) { scene.remove(it.o); }); G.items.length = 0; }
function spawn(it) {
  let o;
  if (it.kind === 0 || it.kind === 1) {
    o = it.kind === 0 ? makeDiya() : makeNote();
    o.userData.x = (it.kind === 0 ? -1 : 1) * D.spotX[(Math.round(it.t * 10)) % 2]; o.userData.y = D.heights[it.h];
  } else { o = makeSymbol(it.v); o.userData.x = 0; o.userData.y = -0.28; }
  it.o = o; it.done = false; scene.add(o); G.items.push(it);
}
function floatText(text, col, pos, size) {
  const p = panel(0.5, 0.12, 400); drawLines(p, [[text, size || 46, col, '800']]); p.position.copy(pos); p.position.y += 0.1; scene.add(p);
  fx.push({ o: p, life: 0.9, vy: 0.25 });
}
function burst(pos, tex) { for (let i = 0; i < 7; i++) { const s = halo(tex, 0.07, 1); s.position.copy(pos); scene.add(s); const a = Math.random() * Math.PI * 2, b = Math.random() * 2 - 1; fx.push({ o: s, life: 0.5, v: new THREE.Vector3(Math.cos(a) * 0.9, b * 0.9, Math.sin(a) * 0.5) }); } }

function collect(it, side, now) {
  const pos = it.o.position.clone(); it.done = true; scene.remove(it.o);
  const right = (it.kind === 0 && side === 0) || (it.kind === 1 && side === 1);
  if (!right) { G.score += D.points.wrong; G.wrong++; G.combo = 0; thud(); burst(pos, GLOW.red); floatText(side === 0 ? 'Right hand!' : 'Left hand!', '#ff6a50', pos); return; }
  const dt = Math.abs(now - it.t), perfect = dt < D.perfect;
  G.score += perfect ? D.points.perfect : D.points.good; if (perfect) G.perfect++; else G.good++;
  G.combo++; G.best = Math.max(G.best, G.combo);
  drumHit(it.t); burst(pos, it.kind === 0 ? GLOW.saffron : GLOW.blue);
  floatText(perfect ? '+' + D.points.perfect : 'Good', perfect ? '#ffe28a' : '#ffffff', pos, perfect ? 46 : 38);
  if (G.combo > 0 && G.combo % 10 === 0) floatText(G.combo + ' combo!', '#ffd060', new THREE.Vector3(0, headBase + 0.25, -1.0), 50);
}
function receive(it) {
  const pos = it.o.position.clone(); it.done = true; scene.remove(it.o);
  G.score += D.points.symbol; G.syms++; G.combo++; G.best = Math.max(G.best, G.combo);
  chime(880, 0.18); setTimeout(function () { chime(1320, 0.12); }, 120); burst(pos, GLOW.gold);
  showVerse(it.v);
  try { const k = 'hcr.haath.seen', s = JSON.parse(localStorage.getItem(k) || '{}'); s[it.v.id] = 1; localStorage.setItem(k, JSON.stringify(s)); } catch (e) {}
}
let verseT = 0;
function showVerse(v) { drawLines(verseP, [[v.symHi + ' · ' + v.sym, 40, '#ffd27a', '800'], [v.line, 30, '#fbe9cf', '600'], [v.meanHi.length > 70 ? v.meanHi.slice(0, 68) + '…' : v.meanHi, 24, '#e8cfae', '500']], 'rgba(30,14,6,.86)'); verseP.visible = true; verseT = 3.2; }

function step(dt) {
  const now = songNow();
  if (G.state === 'run') {
    while (G.next < G.queue.length && G.queue[G.next].t - now < D.lead) spawn(G.queue[G.next++]);
    for (let i = G.items.length - 1; i >= 0; i--) {
      const it = G.items[i]; if (it.done) { G.items.splice(i, 1); continue; }
      const o = it.o; let z;
      if (it.kind === 2) {                                     /* the symbol stops in front of you and waits for pranam */
        z = now < it.t ? D.arriveZ - 0.25 - (it.t - now) * D.speed : D.arriveZ - 0.25;
        o.rotation.y = Math.sin(now * 2) * 0.25; o.userData.hint.visible = now > it.t - 0.8;
        if (now > it.t + D.symHold) { G.miss++; G.combo = 0; scene.remove(o); it.done = true; continue; }
      } else {
        z = D.arriveZ - (it.t - now) * D.speed; o.rotation.y += dt * 2;
        if (now > it.t + D.late) { G.miss++; G.combo = 0; scene.remove(o); it.done = true; continue; }
      }
      placeAhead(o, z); o.position.y += Math.sin(now * 3 + it.t) * 0.012;
      if (z < D.arriveZ - 1.0) continue;                       /* only touchable near the hands */
      if (it.kind === 2) {
        const L = HAND[0], R = HAND[1];
        if (L.seen && R.seen && now > it.t - 0.8 && L.palm.distanceTo(R.palm) < D.pranamR) {
          tmpV.copy(L.palm).add(R.palm).multiplyScalar(0.5); if (tmpV.distanceTo(o.position) < D.pranamReach) receive(it);
        }
      } else {
        let hit = -1;
        for (let s = 0; s < 2 && hit < 0; s++) { const h = HAND[s === 0 ? it.kind : 1 - it.kind]; if (!h.seen) continue;   /* the right hand is checked first */ for (let k = 0; k < h.pts.length; k++) if (h.pts[k].distanceTo(o.position) < D.touchR) { hit = h.side; break; } }
        if (hit >= 0) collect(it, hit, now);
      }
    }
    const scn = currentScene(now); if (scn !== G.lastScene) { G.lastScene = scn; const c = D.sceneColor[scn] || [1, 0.7, 0.35]; sanctum.material.color.setRGB(c[0], c[1], c[2]); door.material.color.setRGB(c[0], c[1], c[2] * 0.8); }
    pillars.forEach(function (p) { p.position.z += dt * D.speed * 0.5; if (p.position.z > 3) p.position.z -= 48; });
    if (now > G.endAt && G.items.length === 0) finish();
  }
  for (let i = fx.length - 1; i >= 0; i--) { const f = fx[i]; f.life -= dt; if (f.v) f.o.position.addScaledVector(f.v, dt); else f.o.position.y += f.vy * dt; f.o.material.opacity = Math.max(0, f.life * 1.6); if (f.life <= 0) { scene.remove(f.o); fx.splice(i, 1); } }
  if (verseT > 0) { verseT -= dt; if (verseT <= 0) verseP.visible = false; }
  hud.position.set(0, headBase + 0.42, -1.5); verseP.position.set(0, headBase - 0.62, -1.2); verseP.rotation.x = -0.35;
  if (G.state === 'run') drawHud();
  pokeButtons();
}
function currentScene(now) { let s = 'ashram'; for (let i = 0; i < D.verses.length; i++) if (D.verses[i].t <= now) s = D.verses[i].scene; return s; }
let hudKey = '';
function drawHud() { const k = G.score + '|' + G.combo; if (k === hudKey) return; hudKey = k; drawLines(hud, [['Score ' + G.score + (G.combo > 2 ? '   ·   Combo ' + G.combo : ''), 44, '#ffe2a8', '700']], 'rgba(30,14,6,.7)'); }

function finish() {
  G.state = 'end'; if (music) { try { music.stop(); } catch (e) {} music = null; }
  const pct = G.total ? Math.round(100 * (G.perfect + G.good + G.syms) / G.total) : 0;
  drawLines(hud, [['JAI HANUMAN', 54, '#ffcf70', '800'], ['Score ' + G.score + '   ·   ' + pct + '% caught', 36], ['Perfect ' + G.perfect + '  ·  Good ' + G.good + '  ·  Wrong hand ' + G.wrong + '  ·  Missed ' + G.miss, 26, '#e8cfae'], ['Verse symbols ' + G.syms + ' / ' + G.symsTotal + '   ·   Best combo ' + G.best, 28, '#e8cfae']], 'rgba(30,14,6,.85)');
  hud.scale.set(1.3, 2.2, 1); hudKey = '';
  if (G.mode === 'song' && darshan) { darshan.visible = true; darshan.position.set(0, headBase + 0.2, -3.0); chime(523, 0.2); setTimeout(function () { chime(784, 0.16); }, 300); }
  setTimeout(function () { if (G.state === 'end') showMenu(true); }, 1500);   /* not if a new run already began */
}
function showMenu(on) {
  buttons.forEach(function (b) { b.visible = on; });
  title.visible = on && G.state === 'menu';
  if (on) {
    const y = headBase - 0.25, z = -0.55;
    bPractice.position.set(-0.24, y, z); bBegin.position.set(0.24, y, z); bExit.position.set(0, y - 0.2, z);
    [bPractice, bBegin, bExit].forEach(function (b) { b.rotation.x = -0.5; });
    title.position.set(0, headBase + 0.15, -1.4);
    if (G.state === 'end') { G.state = 'menu'; drawLines(bBegin, [['AGAIN', 34, '#2a1405', '800'], ['Hanuman Chalisa · Easy', 20, '#4a2a10']], '#ffb35a'); hud.position.set(0, headBase + 0.55, -1.6); }
  } else { hud.scale.set(1, 1, 1); }
}
const bbox = new THREE.Vector3();
function pokeButtons() {
  buttons.forEach(function (b) {
    if (!b.visible) return; let near = false;
    HAND.forEach(function (h) { if (!h.seen) return; bbox.copy(h.tip); b.worldToLocal(bbox); if (Math.abs(bbox.x) < b.userData.w / 2 && Math.abs(bbox.y) < b.userData.h / 2 && Math.abs(bbox.z) < 0.045) near = true; });
    if (near && !b.userData.hot) { b.userData.hot = 1; b.scale.setScalar(0.92); chime(660, 0.1); b.userData.fn(); } else if (!near && b.userData.hot) { b.userData.hot = 0; b.scale.setScalar(1); }
  });
}

/* ---------- loop ---------- */
let lastT = 0;
renderer.setAnimationLoop(function (time, frame) {
  const dt = Math.min(0.05, (time - lastT) / 1000 || 0.016); lastT = time;
  readHands(frame);
  if (!renderer.xr.isPresenting && !sim) head.set(0, 1.6, 0.6);
  step(dt);
  renderer.render(scene, camera);
});

/* ---------- entering VR ---------- */
drawLines(title, [['TEMPLE BEATS · HAATH', 56, '#ffcf70', '800'], ['Left hand: saffron diya    Right hand: blue note', 30], ['Pranam (palms together) for each verse symbol', 30], ['Touch a button below to start', 26, '#e8cfae']], 'rgba(30,14,6,.75)');
showMenu(true);
function enterVR() {
  audioInit();
  navigator.xr.requestSession('immersive-vr', { optionalFeatures: ['local-floor', 'hand-tracking'] }).then(function (s) {
    renderer.xr.setSession(s); $('card').style.display = 'none';
    s.addEventListener('end', function () { $('card').style.display = 'flex'; if (music) { try { music.stop(); } catch (e) {} music = null; } clearItems(); G.state = 'menu'; showMenu(true); });
  }).catch(function (e) { $('btns').innerHTML = '<p>Could not start VR: ' + e.message + '</p>'; });
}
function setButtons(ok) {
  $('btns').innerHTML = ok ? '<button id="go">ENTER VR</button>' : '<p>Open this page in the Quest browser to play.</p><button id="pv" class="alt">Preview here (auto-play)</button>';
  if (ok) $('go').addEventListener('click', enterVR);
  else $('pv').addEventListener('click', function () { audioInit(); $('card').style.display = 'none'; sim = true; begin('practice'); });
}
if (navigator.xr && navigator.xr.isSessionSupported) navigator.xr.isSessionSupported('immersive-vr').then(setButtons).catch(function () { setButtons(false); }); else setButtons(false);

/* ---------- preview / test: simulated hands that touch with the right hand and pranam on time ---------- */
function simHands() {
  const now = songNow(); HAND.forEach(function (h) { h.seen = true; h.tip.set(h.side ? 0.25 : -0.25, headBase - 0.35, -0.2); h.palm.copy(h.tip); h.pts.push(h.tip); });
  G.items.forEach(function (it) {
    if (it.done || now < it.t - 0.06 || now > it.t + 0.3) return;
    if (it.kind === 2) { HAND[0].palm.copy(it.o.position); HAND[1].palm.copy(it.o.position); }
    else { const h = HAND[it.kind]; h.tip.copy(it.o.position); }
  });
  HAND.forEach(function (h) { h.balls[9].position.copy(h.tip); h.balls[9].visible = true; });
}
window.HAATH = { G: G, D: D, begin: begin, sim: function (on) { sim = on; }, state: function () { return G.state + ' ' + G.mode + ' t=' + songNow().toFixed(1) + ' score=' + G.score + ' perfect=' + G.perfect + ' good=' + G.good + ' wrong=' + G.wrong + ' miss=' + G.miss + ' syms=' + G.syms + '/' + G.symsTotal + ' items=' + G.items.length; } };
})();
