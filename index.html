<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #1a1410; color: #f4ead8; touch-action: none;

  #card .link { display: block; margin: 10px auto 0; padding: 4px 8px; background: none; border: 0; box-shadow: none; letter-spacing: 0; color: #e8cf9a; font: 700 15px 'Roboto Condensed', Arial, sans-serif; text-decoration: underline; }
  /* manuscript diary */
  #diary { position: fixed; inset: 0; z-index: 30; display: none; flex-direction: column; align-items: center; justify-content: center; gap: 10px; background: radial-gradient(ellipse at 50% 40%, #2a1a10, #0c0704 75%); padding: 12px; }

  #diary .page { position: absolute; inset: 0; transform-origin: left center; border-radius: 4px 10px 10px 4px; overflow: hidden;
    background:
      url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .45  0 0 0 0 .3  0 0 0 0 .12  0 0 0 .16 0'/></filter><rect width='220' height='220' filter='url(%23n)'/></svg>"),
      radial-gradient(ellipse at 50% 45%, #f6e7c4 0%, #ecd6a6 55%, #d6b278 88%, #b98a4e 100%);

  @keyframes pageOutR { to { transform: rotateY(100deg); opacity: .2; } } @keyframes pageInR { from { transform: rotateY(-60deg); opacity: .2; } }
  #diary .frame { position: absolute; inset: 14px; border: 2px solid #9b2a17; outline: 1px solid #9b2a17; outline-offset: 4px; border-radius: 2px; padding: 16px 16px 12px; display: flex; flex-direction: column; align-items: center; text-align: center; gap: 8px; }

  #darshan .door.l { left: 0; transform-origin: left center; } #darshan .door.r { right: 0; transform-origin: right center; }

<script id="sxr-logic">
// Pure rules: no THREE, no document, no window. Units: metres, seconds. Translates line by line to C#.
// The song is the clock: t is the song time, dist = t * speed, so a thing laid at song time s is reached at s.
class SxrRng {
  constructor(seed) { this.s = seed >>> 0; }
  next() {                                   // float 0..1 (mulberry32)
    this.s = (this.s + 0x6D2B79F5) >>> 0;
    let t = this.s;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  }
  int(n) { return Math.floor(this.next() * n); }
}

class HanumanRun {
  constructor(data) {
    this.d = data;
    this.rng = new SxrRng(data.seed);
    this.state = "ready";      // "ready" | "running" | "over"
    this.speed = data.speed;   // float, m/s, fixed so the beat grid stays on the song
    this.len = data.finishAt * data.speed; // float, metres to the finish
    this.t = 0;                // float, song seconds
    this.dist = 0;             // float
    this.lane = 1; this.x = 0; this.y = 0; this.vy = 0; this.duckT = 0;
    this.flame = data.flameMax; // int, bhakti flame 0..flameMax; never ends the run
    this.invulnT = 0;          // float
    this.glideT = 0;           // float, > 0 while flying
    this.combo = 0; this.bestCombo = 0; // int
    this.diyas = 0;            // int, collected
    this.score = 0; this.best = 0; // int
    this.hits = 0;             // int, obstacles hit
    this.verse = -1;           // int, line being sung (index into data.verses), -1 before the first
    this.scene = "";           // string, scene id of the current line
    this.got = [];             // bool per verse: symbol collected
    this.lost = [];            // bool per verse: symbol lost to a hit
    this.practice = false;     // bool, beats-only practice before the first real run (no song, no symbols, no obstacles)
    this.shift = 0;            // float, song time of the practice's t = 0 (drum hits are taken from the song)
    this.endAt = data.finishAt; // float, when this run ends
    this.first = 0;            // int
    this.items = [];           // {id, kind, lane, z, y, v, taken, missed}
    this.build();

  ev(type, kind, id, value) { return { type: type, kind: kind, id: id, value: value }; }

  reset() {

    this.lane = 1; this.x = 0; this.y = 0; this.vy = 0; this.duckT = 0;
    this.flame = d.flameMax; this.invulnT = 0; this.glideT = 0;
    this.combo = 0; this.bestCombo = 0; this.diyas = 0; this.score = 0; this.hits = 0;

  start() {

    return [this.ev("start", "", -1, 0)];
  }
  left()  { if (this.state !== "running" || this.lane <= 0) return []; this.lane -= 1; return [this.ev("lane", "", -1, this.lane)]; }
  right() { if (this.state !== "running" || this.lane >= this.d.lanes - 1) return []; this.lane += 1; return [this.ev("lane", "", -1, this.lane)]; }

    this.vy = this.d.jumpSpeed; this.duckT = 0;
    return [this.ev("jump", "", -1, 0)];
  }
  duck() {
    if (this.state !== "running" || this.glideT > 0) return [];
    this.duckT = this.d.duckSeconds;
    if (this.y > 0) this.vy = -this.d.fastFall;
    return [this.ev("duck", "", -1, 0)];
  }
  continueRun() { return []; }

  add(kind, lane, t, y, v) {

  }
  sceneOf(id) {
    const s = this.d.scenes;
    for (let i = 0; i < s.length; i++) if (s[i].id === id) return s[i];
    return s[0];
  }
  flying(t) {
    const f = this.d.fly;

    return false;
  }
  // one sung line = 8 beats from t0. Diyas on the song's own kick and clap hits (data.hits) in one lane,
  // the verse symbol on the first beat, and (outside calm and flying scenes) one obstacle on beat 5
  // that the diyas lead over, under or round.
  layLine(t0, t1, v, sc, lane) {

    const fly = this.flying(t0 + b);
    const yAir = fly ? d.glideHeight : 0;

    if (!fly && sc.obstacles.length > 0 && v >= 0) ob = sc.obstacles[r.int(sc.obstacles.length)];
    const k = ob === "" ? null : d.kinds[ob];

      if (k !== null && k.duck && Math.abs(t - tOb) < 0.25) y = 0;                            // under a bar: stay low
      this.add(kind, lane, t, y, -1);
    }
    if (k !== null) {
      this.add(ob, ob === "toran" || ob === "drain" ? -1 : lane, tOb, 0, -1);
      if (k.clearY > 50) { const third = 3 - lane - side; if (r.next() < 0.5) this.add(ob, third, tOb, 0, -1); }
    }

  }
  nextLane(end) { if (end === 0) return 1; if (end === 2) return 1; return this.rng.next() < 0.5 ? 0 : 2; }
  setPractice(on) { this.practice = on; }
  buildPractice() {
    const d = this.d, p = d.practice, bar = d.beat * 8;
    this.items = []; this.first = 0; this.got = []; this.lost = [];
    for (let i = 0; i < d.verses.length; i++) { this.got.push(false); this.lost.push(false); }
    this.shift = p.from - p.lead; this.endAt = p.lead + p.len + 1.5;
    let lane = 1;
    for (let t = p.from; t < p.from + p.len - 0.01; t += bar) {
      for (let i = 0; i < d.hits.length; i++) {
        const h = d.hits[i];
        if (h[0] < t || h[0] >= t + bar) continue;
        this.add(h[1] === 1 ? "note" : "diya", lane, h[0] - this.shift, 0, -1);
      }
      lane = this.nextLane(lane);
    }
    this.items.sort(function (a, b) { return a.z - b.z; });
    for (let i = 0; i < this.items.length; i++) this.items[i].id = i;
  }
  build() {
    if (this.practice) { this.buildPractice(); return; }
    this.shift = 0; this.endAt = this.d.finishAt;
    const d = this.d, vs = d.verses, bar = d.beat * 8;
    this.items = []; this.first = 0; this.got = []; this.lost = [];
    for (let i = 0; i < vs.length; i++) { this.got.push(false); this.lost.push(false); }
    let lane = 1;
    for (let t = vs[0].t - bar * Math.ceil((vs[0].t - d.introFrom) / bar); t < vs[0].t - 0.01; t += bar) {   // music before the first line
      lane = this.nextLane(this.layLine(Math.max(d.introFrom, t), t + bar, -1, this.sceneOf("calm"), lane));
    }
    for (let i = 0; i < vs.length; i++) {
      const next = i + 1 < vs.length ? vs[i + 1].t : vs[i].t + bar;
      lane = this.nextLane(this.layLine(vs[i].t, next, i, this.sceneOf(vs[i].scene), lane));
    }
    for (let t = vs[vs.length - 1].t + bar; t < d.finishAt - 0.5; t += bar) {                              // music after the last line
      lane = this.nextLane(this.layLine(t, Math.min(d.finishAt - 0.5, t + bar), -1, this.sceneOf("calm"), lane));
    }
    this.items.sort(function (p, q) { return p.z - q.z; });
    for (let i = 0; i < this.items.length; i++) this.items[i].id = i;
  }
  itemX(it) { return it.lane < 0 ? this.x : (it.lane - 1) * this.d.laneWidth; }
  missedPick(it, out) {
    it.missed = true;
    if (it.kind === "symbol") { this.combo = 0; out.push(this.ev("missSymbol", "", it.id, it.v)); }

  }
  hitBy(it, out) {
    const d = this.d;
    it.taken = true; this.invulnT = d.invulnSeconds; this.combo = 0;
    if (this.flame > 0) this.flame -= 1;
    this.hits += 1; this.score = Math.max(0, this.score - d.hitPenalty);
    out.push(this.ev("hit", it.kind, it.id, this.flame));

    for (let i = this.first; i < this.items.length; i++) {

      if (o.kind === "symbol" && o.v === this.verse && !o.taken && !o.missed) {
        o.missed = true; this.lost[o.v] = true; out.push(this.ev("lostSymbol", "", o.id, o.v)); break;

    }

  step(dt) {

    if (this.glideT > 0) {
      this.vy = 0; this.y += (d.glideHeight - this.y) * Math.min(1, dt * 5);
    } else if (this.y > 0 || this.vy > 0) {
      this.y += this.vy * dt; this.vy -= d.gravity * dt;
      if (this.y <= 0) { this.y = 0; this.vy = 0; out.push(this.ev("land", "", -1, 0)); }
    }
    while (this.first < this.items.length && this.items[this.first].z < this.dist - 4) this.first += 1;
    for (let i = this.first; i < this.items.length; i++) {
      const it = this.items[i];
      const rel = it.z - this.dist;
      if (rel > 4) break;
      if (it.taken || it.missed) continue;
      const k = d.kinds[it.kind];
      if (k.pick && rel < -k.halfZ) { this.missedPick(it, out); continue; }
      if (Math.abs(rel) > k.halfZ) continue;
      const dx = Math.abs(this.x - this.itemX(it));
      if (k.pick) {

          this.score += k.points;

          else {
            this.got[it.v] = true;
            if (this.flame < d.flameMax) { this.flame += 1; out.push(this.ev("relit", "", it.id, this.flame)); }
          }
          out.push(this.ev("pick", it.kind, it.id, it.v));
        }
        continue;
      }
      if (dx > k.halfW || this.glideT > 0 || this.invulnT > 0) continue;
      const hit = k.duck ? this.duckT <= 0 : this.y < k.clearY;
      if (hit) this.hitBy(it, out);
    }
    if (this.t >= this.endAt) {
      this.state = "over";
      if (this.practice) { out.push(this.ev("practiceOver", "", -1, this.diyas)); return out; }
      if (this.score > this.best) this.best = this.score;
      out.push(this.ev("over", "", -1, this.versesGot()));
    }
    return out;
  }
  versesGot() { let n = 0; for (let i = 0; i < this.got.length; i++) if (this.got[i]) n += 1; return n; }
  stars() { const n = this.versesGot(), s = this.d.stars; return n >= s[2] ? 3 : n >= s[1] ? 2 : n >= s[0] ? 1 : 0; }

  // Nearest thing ahead the player should react to (for hints). "" when nothing is near.
  nextKind(seconds) {
    const look = this.speed * seconds;
    for (let i = this.first; i < this.items.length; i++) {
      const it = this.items[i];
      const rel = it.z - this.dist;
      if (rel > look) break;
      if (it.taken || rel < 1) continue;
      if (this.d.kinds[it.kind].pick) continue;
      if (it.lane < 0 || it.lane === this.lane) return it.kind;
    }
    return "";
  }
  // What a careful player would do now: "left" | "right" | "jump" | "duck" | "". Used by the play test.
  advise() {
    if (this.state !== "running") return "";
    const look = this.speed * 0.9;
    for (let i = this.first; i < this.items.length; i++) {
      const it = this.items[i];
      const rel = it.z - this.dist;
      if (rel > look) break;
      if (it.taken || it.missed || rel < -0.5) continue;
      const k = this.d.kinds[it.kind];
      if (k.pick) {                              // follow the diyas and symbols
        if (it.lane !== this.lane && rel < look * 0.8) return it.lane < this.lane ? "left" : "right";
        continue;
      }
      if (this.glideT > 0) continue;
      const mine = it.lane < 0 || it.lane === this.lane;
      if (!mine) continue;
      if (k.clearY > 50) continue;               // the diyas already lead round it
      if (k.duck) { if (rel < this.speed * 0.22 && this.duckT <= 0.2) return "duck"; continue; }
      if (rel < this.speed * 0.3 && this.y === 0 && this.vy === 0) return "jump";
    }
    return "";
  }
  line() {
    return "state " + this.state + " t " + this.t.toFixed(1) + " verse " + this.verse + " scene " + this.scene + " flame " + this.flame +
      " hits " + this.hits + " verses " + this.versesGot() + "/" + this.got.length + " diyas " + this.diyas + " combo " + this.combo + " best " + this.bestCombo + " score " + this.score;
  }
}

      if (want) { hintCount[want] = (hintCount[want] || 0) + 1; const h = TX.hints[want]; $('hint').innerHTML = '<b>' + h[0] + '</b>' + h[1]; }
      $('hint').style.opacity = want ? 1 : 0; hintKind = want;
    }
    if (VR.on) vrRender(); else renderer.render(scene, camera);
  }

  // ---------- LAB ----------
  window.LAB = {
    api: {
      start: function () { audio(); if (game.state !== 'ready') return; if (!canStart()) { pendingStart = true; loadingCard(); return; } pendingStart = false; show(game.start()); },
      restart: function () { audio(); if (game.practice) game.setPractice(false); show(game.reset()); LAB.api.start(); },
      left: function () { show(game.left()); },
      right: function () { show(game.right()); },
      jump: function () { show(game.jump()); },
      duck: function () { show(game.duck()); },
      continueRun: function () { show(game.continueRun()); },
      toggleMute: function () { muted = !muted; if (master) master.gain.value = muted ? 0 : 0.7; $('mute').textContent = muted ? 'OFF' : 'ON'; },
      simulate: function (dt) { show(game.step(dt)); }
    },
    input: {
      ax: 0, ay: 0,
      pose: function (pos, quat) { /* not used: the run is steered by joystick and buttons */ },
      button: function (name, down) {
        if (!down) return;
        if (name === 'A') { if (game.state === 'ready') LAB.api.start(); else if (game.state === 'darshan') LAB.api.continueRun(); else if (game.state === 'over') LAB.api.restart(); else LAB.api.jump(); }
        else if (name === 'L') { if (game.state === 'ready') LAB.api.start(); else LAB.api.jump(); }
        else if (name === 'U') LAB.api.duck();
        else if (name === 'B') LAB.api.restart();
        else if (name === 'D') LAB.api.toggleMute();
      },
      axis: function (x, y) {                 // joystick: each push past half way is one move
        const i = LAB.input;
        if (x < -0.5 && i.ax >= -0.5) LAB.api.left();
        if (x > 0.5 && i.ax <= 0.5) LAB.api.right();
        if (y > 0.5 && i.ay <= 0.5) LAB.api.jump();
        if (y < -0.5 && i.ay >= -0.5) LAB.api.duck();
        i.ax = x; i.ay = y;
      },
      release: function () { LAB.input.ax = 0; LAB.input.ay = 0; }
    },
    state: function () { return game.line(); },
    models: function () {
      return { runner: runner, temple: temple, chunk0: CHUNKS[0], chunk1: CHUNKS[1], chunk2: CHUNKS[2],
        flower: PROTO.flower, bell: PROTO.bell, coconut: PROTO.coconut, ghee: PROTO.ghee, bead: PROTO.bead, puddle: PROTO.puddle,
        basket: PROTO.basket, cart: PROTO.cart, toran: PROTO.toran, drain: PROTO.drain, monkey: PROTO.monkey, sevaSpot: PROTO.seva, barrier: PROTO.barrier, pots: PROTO.pots, stall: PROTO.stall };
    },
    // plays the first stretch to the temple through LAB.api only, with the rules' own careful-player advice
    test: function () {
      LAB.testing = true;
      game.setPractice(false); show(game.reset()); show(game.start()); srcs.forEach(function (s) { try { s.stop(); } catch (e) {} }); songStart = -1;
      let n = 0;
      while (game.state === 'running' && n < 30000) { const a = game.advise(); if (a) LAB.api[a](); LAB.api.simulate(1 / 60); n++; }
      LAB.testing = false; return LAB.state();
    },
    game: game, paused: false, ready: false, icons: function () { return ICON_URL; }, vr: function () { return { on: VR.on, got: VR.got, pitch: +VR.e.x.toFixed(3), yaw: +VR.e.y.toFixed(3), roll: +VR.e.z.toFixed(3) }; }
  };

  ['pointerdown', 'touchend', 'click'].forEach(function (n) { addEventListener(n, function () { audio(); }, true); });
  prefetch();                                  // download the song at once; the sound itself starts on the first touch
  addEventListener('resize', size); size();
  printRam(function () { layItems(); });
  layItems(); applyTheme(); show([]);
  if (/[?&]vr=1/.test(location.search)) { card('VR HEADSET', '<p>Tap the button, put the phone sideways in the headset and look straight ahead.</p><p>Tilt your head left or right to change lane, look up to jump, look down to slide. Tap the screen to recentre.</p>', ''); $('cBody').insertAdjacentHTML('beforeend', '<button id="vrGo" class="big">START IN VR</button>'); $('vrGo').addEventListener('click', function (e) { e.stopPropagation(); vrEnter(); }); }
  else if (/[?&]xr=1/.test(location.search)) card('QUEST VR', '<p>Checking for VR...</p>', ''); /* xrCard() replaces it once VR is confirmed */
  else if (firstTime()) tutorial(practiceIntro); else startCard();
  function setPaused(on) {
    if (on && game.state !== 'running') { if (ac && document.hidden) ac.suspend(); return; }
    LAB.paused = on; $('paused').style.display = on ? 'flex' : 'none';
    if (ac) { if (on) ac.suspend(); else ac.resume(); }
  }
  $('pause').addEventListener('click', function (e) { e.stopPropagation(); setPaused(true); });
  $('paused').addEventListener('click', function (e) { e.stopPropagation(); setPaused(false); });
  document.addEventListener('visibilitychange', function () { if (XR.on) return; if (document.hidden) setPaused(true); else if (!LAB.paused && ac && ac.state === 'suspended') ac.resume(); });
  let last = performance.now();
  function frame(now) {
    $('pause').style.display = game.state === 'running' ? 'block' : 'none';
    now = now || last;
    const dt = Math.min(0.05, (now - last) / 1000); last = now;
    let sdt = dt;
    if (game.state === 'running' && songStart > 0) sdt = Math.max(0, Math.min(0.1, (ac.currentTime - songStart) - game.t));
    if (!LAB.paused) show(game.step(sdt));
    draw(dt);
    LAB.ready = true;
    if (XR.on) xrInput();
  }
  renderer.setAnimationLoop(frame);   /* also keeps running inside the headset, where window frames stop */
})();
</script>

<script id="sxr-ui">
(function () {
  var sx = 0, sy = 0, down = false, fired = false;
  var cv = document.querySelector('canvas');
  function state() { return LAB.game.state; }
  cv.addEventListener('pointerdown', function (e) { down = true; fired = false; sx = e.clientX; sy = e.clientY; });
  cv.addEventListener('pointermove', function (e) {
    if (!down || fired) return;
    var dx = e.clientX - sx, dy = e.clientY - sy;
    if (Math.abs(dx) < 22 && Math.abs(dy) < 22) return;
    fired = true;
    if (Math.abs(dx) > Math.abs(dy)) { if (dx < 0) LAB.api.left(); else LAB.api.right(); }
    else { if (dy < 0) LAB.api.jump(); else LAB.api.duck(); }
  });
  addEventListener('pointerup', function () {
    if (down && !fired) { if (state() === 'ready' && !pendingStart && document.getElementById('card').style.display !== 'block') LAB.api.start(); else if (state() === 'darshan') LAB.api.continueRun(); }
    down = false;
  });
  document.getElementById('card').addEventListener('click', function () {
    if (state() === 'darshan') LAB.api.continueRun();
  });
  document.getElementById('cBtn').addEventListener('click', function (e) {
    e.stopPropagation();
    if (state() === 'over') LAB.api.restart(); else if (state() === 'ready') LAB.api.start();
  });
  document.getElementById('mute').addEventListener('click', function () { LAB.api.toggleMute(); });
  addEventListener('keydown', function (e) {
    var k = e.key;
    if (k === 'ArrowLeft' || k === 'a') LAB.api.left();
    else if (k === 'ArrowRight' || k === 'd') LAB.api.right();
    else if (k === 'ArrowUp' || k === 'w' || k === ' ') { if (state() === 'ready') LAB.api.start(); else if (state() === 'darshan') LAB.api.continueRun(); else LAB.api.jump(); }
    else if (k === 'ArrowDown' || k === 's') LAB.api.duck();
    else if (k === 'Enter') { if (state() === 'over') LAB.api.restart(); else if (state() === 'ready') LAB.api.start(); }
  });
})();
</script>

<script id="sxr-kit">
/* sxr-kit v1: paste unchanged into every SenseXR web lab as <script id="sxr-kit">.
   Needs THREE (r128) and a global LAB object (see the skill). Adds:
   SXR.check()        -> list of problems that would make the Unity port slower
   SXR.exportLab()    -> saves every model in LAB.models() as <name>.sxr.json
   window.SenseXR     -> controller entry point, forwards to LAB.input
   Open the page with ?sxr=export to export automatically (used by Claude Code). */
(function () {
  'use strict';
  var SXR = window.SXR = { version: 1 };

  function b64(t) {
    var u = new Uint8Array(t.buffer, t.byteOffset, t.byteLength), s = '', i, C = 0x8000;
    for (i = 0; i < u.length; i += C) s += String.fromCharCode.apply(null, u.subarray(i, i + C));
    return btoa(s);
  }
  function attr(a, n) {
    var out = new Float32Array(a.count * n), i;
    for (i = 0; i < a.count; i++) {
      out[i * n] = a.getX(i);
      if (n > 1) out[i * n + 1] = a.getY(i);
      if (n > 2) out[i * n + 2] = a.getZ(i);
    }
    return out;
  }

  SXR.exportModel = function (root, name) {
    root.updateMatrixWorld(true);
    var out = { version: 1, name: name || root.name || 'model', nodes: [], meshes: [], mats: [], texs: [], skipped: [] };
    var meshIx = new Map(), matIx = new Map(), texIx = new Map();

    function tex(t) {
      if (!t || !t.image) return -1;
      if (texIx.has(t)) return texIx.get(t);
      var ix = -1;
      try {
        var im = t.image, c = document.createElement('canvas');
        c.width = im.width; c.height = im.height;
        c.getContext('2d').drawImage(im, 0, 0);
        ix = out.texs.length;
        out.texs.push(c.toDataURL('image/png').split(',')[1]);
      } catch (e) { out.skipped.push('texture (not readable): ' + (t.name || '?')); }
      texIx.set(t, ix); return ix;
    }
    function mat(m) {
      if (!m) return -1;
      if (matIx.has(m)) return matIx.get(m);
      var shader = !!m.isShaderMaterial;
      if (shader) out.skipped.push('shader material (exported as plain white, rebuild by hand): ' + (m.name || '?'));
      var e = m.emissive ? m.emissive.clone().multiplyScalar(m.emissiveIntensity === undefined ? 1 : m.emissiveIntensity) : null;
      var d = {
        name: m.name || '',
        unlit: !!(m.isMeshBasicMaterial || shader),
        color: m.color ? m.color.toArray() : [1, 1, 1],
        opacity: m.transparent ? m.opacity : 1,
        emissive: e ? e.toArray() : [0, 0, 0],
        metal: m.metalness === undefined ? 0 : m.metalness,
        rough: m.roughness === undefined ? 1 : m.roughness,
        vcol: !!m.vertexColors,
        side: m.side === THREE.DoubleSide ? 2 : (m.side === THREE.BackSide ? 1 : 0),
        additive: m.blending === THREE.AdditiveBlending,
        tex: tex(m.map)
      };
      var ix = out.mats.length; out.mats.push(d); matIx.set(m, ix); return ix;
    }
    function mesh(g) {
      if (meshIx.has(g)) return meshIx.get(g);
      var p = g.attributes.position, d = { vc: p.count, pos: b64(attr(p, 3)), nrm: '', uv: '', col: '', idx: '', groups: [] };
      if (g.attributes.normal) d.nrm = b64(attr(g.attributes.normal, 3));
      if (g.attributes.uv) d.uv = b64(attr(g.attributes.uv, 2));
      if (g.attributes.color) d.col = b64(attr(g.attributes.color, 3));
      var n = g.index ? g.index.count : p.count, ix = new Uint32Array(n), i;
      for (i = 0; i < n; i++) ix[i] = g.index ? g.index.getX(i) : i;
      d.idx = b64(ix);
      (g.groups || []).forEach(function (r) { d.groups.push(r.start, r.count, r.materialIndex || 0); });
      var k = out.meshes.length; out.meshes.push(d); meshIx.set(g, k); return k;
    }
    function blank(o, parent) {
      return { name: o.name || '', parent: parent, p: o.position.toArray(), q: o.quaternion.toArray(), s: o.scale.toArray(), visible: o.visible, mesh: -1, mats: [] };
    }
    function node(o, parent) {
      var n = blank(o, parent), ix = out.nodes.length;
      out.nodes.push(n);
      if (o.isInstancedMesh) {
        var m = new THREE.Matrix4(), P = new THREE.Vector3(), Q = new THREE.Quaternion(), S = new THREE.Vector3();
        var gi = mesh(o.geometry), mi = mat(Array.isArray(o.material) ? o.material[0] : o.material), i;
        for (i = 0; i < o.count; i++) {
          o.getMatrixAt(i, m); m.decompose(P, Q, S);
          out.nodes.push({ name: (o.name || 'inst') + '#' + i, parent: ix, p: P.toArray(), q: Q.toArray(), s: S.toArray(), visible: true, mesh: gi, mats: [mi] });
        }
        if (o.instanceColor) out.skipped.push('instance colours: ' + (o.name || '?'));
      } else if (o.isMesh) {
        n.mesh = mesh(o.geometry);
        n.mats = (Array.isArray(o.material) ? o.material : [o.material]).map(mat);
      } else if (o.isLine || o.isPoints || o.isSprite) {
        out.skipped.push((o.isLine ? 'line' : o.isPoints ? 'points' : 'sprite') + ': ' + (o.name || '?'));
      }
      o.children.forEach(function (c) { node(c, ix); });
    }
    node(root, -1);
    return out;
  };

  SXR.save = function (file, text) {
    var local = /^https?:$/.test(location.protocol) && /^(localhost|127\.0\.0\.1)$/.test(location.hostname);
    if (local) {
      return fetch('/sxr-save?name=' + encodeURIComponent(file), { method: 'POST', body: text })
        .then(function (r) { return r.ok ? 'saved ' + file : 'FAILED ' + file; });
    }
    var a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([text], { type: 'application/json' }));
    a.download = file; document.body.appendChild(a); a.click(); a.remove();
    return Promise.resolve('downloaded ' + file);
  };

  SXR.sheet = function () {
    var el = document.getElementById('sxr-port-sheet');
    try { return el ? JSON.parse(el.textContent) : null; } catch (e) { return null; }
  };

  SXR.check = function () {
    var bad = [], L = window.LAB, s = SXR.sheet();
    if (!s) bad.push('no valid <script type="application/json" id="sxr-port-sheet">');
    ['sxr-data', 'sxr-logic', 'sxr-view'].forEach(function (id) {
      if (!document.getElementById(id)) bad.push('missing <script id="' + id + '">');
    });
    var lg = document.getElementById('sxr-logic');
    if (lg && /\b(THREE|document|window)\.\w/.test(lg.textContent)) bad.push('sxr-logic uses THREE / document / window: keep it pure');
    if (!L) { bad.push('no global LAB'); return bad; }
    ['api', 'state', 'models', 'test'].forEach(function (k) { if (!L[k]) bad.push('LAB.' + k + ' missing'); });
    if (L.models) {
      var ms = L.models(), k;
      for (k in ms) ms[k].traverse(function (o) {
        if (o.userData && o.userData.moves && !o.name) bad.push('moving object without a name in model ' + k);
      });
    }
    if (s && L.api) (s.controls || []).forEach(function (c) {
      if (c.calls && !L.api[c.calls.split('(')[0]]) bad.push('port sheet control calls unknown LAB.api.' + c.calls);
    });
    return bad;
  };

  SXR.exportLab = function () {
    var ms = window.LAB.models(), jobs = [], k, skipped = [];
    for (k in ms) {
      var d = SXR.exportModel(ms[k], k);
      d.skipped.forEach(function (x) { skipped.push(k + ': ' + x); });
      jobs.push(SXR.save(k + '.sxr.json', JSON.stringify(d)));
    }
    var s = SXR.sheet();
    if (s) jobs.push(SXR.save('port-sheet.json', JSON.stringify(s, null, 1)));
    ['sxr-data', 'sxr-logic'].forEach(function (id) {
      var el = document.getElementById(id);
      if (el) jobs.push(SXR.save(id + (id === 'sxr-data' ? '.json' : '.js'), el.textContent));
    });
    jobs.push(SXR.save('export-report.json', JSON.stringify({ check: SXR.check(), skipped: skipped }, null, 1)));
    return Promise.all(jobs);
  };

  // Controller entry point: the same calls the Unity adapter will make.
  window.SenseXR = window.SenseXR || {
    setPose: function (pos, quat) { var i = window.LAB && LAB.input; if (i && i.pose) i.pose(pos, quat); },
    button: function (name, down) { var i = window.LAB && LAB.input; if (i && i.button) i.button(name, down); },
    axis: function (x, y) { var i = window.LAB && LAB.input; if (i && i.axis) i.axis(x, y); },
    release: function () { var i = window.LAB && LAB.input; if (i && i.release) i.release(); }
  };

  if (/[?&]sxr=export/.test(location.search)) {
    var tries = 0, t = setInterval(function () {
      if (window.LAB && LAB.ready) {
        clearInterval(t);
        SXR.exportLab().then(function (r) { document.title = 'SXR-EXPORT-DONE ' + r.length; window.SXR_EXPORT = r; });
      } else if (++tries > 300) { clearInterval(t); document.title = 'SXR-EXPORT-TIMEOUT'; }
    }, 100);
  }
})();

</script>
